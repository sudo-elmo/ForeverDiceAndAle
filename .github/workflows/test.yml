---
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check
        run: for f in *.lua; do luac5.1 -p "$f" || exit 1; done

      - name: Rules and game flow test
        run: lua5.1 tests/rules_test.lua .

      - name: Multiplayer simulation test
        run: lua5.1 tests/net_test.lua .
